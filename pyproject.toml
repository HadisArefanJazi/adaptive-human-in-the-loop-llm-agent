[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-hitl-agent"
version = "0.2.0"
description = "A cost-aware agent that learns when to answer, retrieve, use a tool, or escalate to a human."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hadis ArefanJazi" }]
dependencies = [
  "torch>=2.1",
]

[project.optional-dependencies]
hf = [
  "transformers>=4.40",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.12,<1",
]

[project.scripts]
adaptive-hitl = "adaptive_hitl_agent.cli:main"

[tool.setuptools.packages.find]
include = ["adaptive_hitl_agent*"]

[tool.setuptools.package-data]
"adaptive_hitl_agent.data" = ["*.json", "*.jsonl"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["adaptive_hitl_agent"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
